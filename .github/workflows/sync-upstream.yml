name: Sync fork with upstream code-server

on:
  schedule:
    - cron: "0 3 * * *" 
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}


      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Adicionar remote upstream
        run: |
          git remote add upstream https://github.com/coder/code-server.git || true
          git fetch upstream

      - name: Mesclar upstream/main na branch atual
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Branch atual: $BRANCH"
          git merge upstream/main --no-edit || {
            echo "Conflito no merge automático. Abortando para revisão manual.";
            git merge --abort;
            exit 1;
          }

      - name: Push para o fork
        run: git push origin HEAD

      - name: Criar tag de release automaticamente
        env:
          SUFFIX: "-alpine1"   # troque para -alpine2, -alpine3... se só mudar o empacotamento
        run: |
          VERSION=$(jq -r .version package.json)
          TAG="v${VERSION}${SUFFIX}"
          echo "Versão detectada no code-server: $VERSION"
          echo "Tag alvo: $TAG"

          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "Tag $TAG já existe no fork — nada a fazer, build não será disparado de novo."
          else
            echo "Tag $TAG não existe ainda. Criando e enviando..."
            git tag "$TAG"
            git push origin "$TAG"
          fi
