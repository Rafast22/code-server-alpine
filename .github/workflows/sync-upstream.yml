name: Sync fork with upstream code-server

on:
  schedule:
    - cron: "0 3 * * *" 
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Adicionar remote upstream e buscar tags
        run: |
          git remote add upstream https://github.com/coder/code-server.git || true
          git fetch upstream --tags --force
          git fetch upstream main

      - name: Mesclar upstream mantendo apenas workflows locais
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Branch atual: $BRANCH"
          git merge upstream/main --no-commit --no-ff || true
          # Garante que os seus workflows personalizados do Alpine fiquem preservados
          git checkout HEAD -- .github/workflows/ || true
          git commit -m "chore: sync with upstream code-server" || echo "Sem alterações para commit no código"
          git push origin HEAD

      - name: Detectar última versão e criar tag de release
        env:
          SUFFIX: "-alpine1"
        run: |
          # 1. Encontra a tag de versão estável mais recente do upstream (ex: v4.138.0)
          LATEST_UPSTREAM_TAG=$(git tag -l --sort=-v:refname "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          
          if [ -z "$LATEST_UPSTREAM_TAG" ]; then
            LATEST_UPSTREAM_TAG=$(git describe --tags --abbrev=0 upstream/main 2>/dev/null || echo "v4.138.0")
          fi

          VERSION="${LATEST_UPSTREAM_TAG#v}"
          TAG="v${VERSION}${SUFFIX}"

          echo "Última versão oficial detectada: $VERSION"
          echo "Tag do Alpine a ser criada: $TAG"

          # 2. Se a tag não existir, cria e envia para o GitHub (o que dispara o build-apk.yml automaticamente)
          if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "A tag $TAG já existe no fork. Nada pendente para compilar."
          else
            echo "Nova versão detectada! Criando e enviando tag $TAG..."
            git tag "$TAG"
            git push origin "$TAG"
            echo "Tag $TAG enviada com sucesso! O build do APK foi iniciado automaticamente."
          fi
